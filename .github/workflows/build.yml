name: Build desktop packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            test_args: -- --race
          - os: windows-2025
            test_args: ''
    env:
      AZURE_OPENAI_API_KEY: ''
      AZURE_OPENAI_AUTH_TOKEN: ''
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@v4
        with:
          path: .cache/runtimes/downloads
          key: runtime-inputs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/runtime-lock.json') }}
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          "MAKENSIS_BINARY=${env:ProgramFiles(x86)}\NSIS\makensis.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Prepare verified runtime inputs
        run: npm run runtime:prepare
      - name: Test using the shared local command
        run: npm test ${{ matrix.test_args }}
      - name: Build and package using the shared local command
        run: npm run package -- --out build/package/OneByOne
      - name: Verify native distribution without external Git or rg
        run: node scripts/smoke-package.mjs build/package/OneByOne
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: OneByOne-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/package/*.zip
            build/package/*-Setup.exe
          if-no-files-found: error
          retention-days: 14
